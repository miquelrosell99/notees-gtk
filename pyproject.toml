[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notees-gtk"
version = "0.1.0"
description = "First-class GTK/Adwaita desktop client for Notees"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic>=2",
]

[project.optional-dependencies]
ui = [
    "PyGObject>=3.50",
]

[project.urls]
Homepage = "https://github.com/miquelrosell99/notees-gtk"
Repository = "https://github.com/miquelrosell99/notees-gtk"

[project.scripts]
notees-gtk = "notees_gtk.main:run"

[dependency-groups]
dev = [
    "build>=1.2",
    "pytest>=9.0.3",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# GTK modules must call gi.require_version() before gi.repository imports.
"src/notees_gtk/ui/**" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
