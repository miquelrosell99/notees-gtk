name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  python-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Upload Python distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  archpkg:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Prepare build environment
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed git base-devel python-build python-installer python-wheel python-hatchling python-httpx python-pydantic python-gobject gtk4 libadwaita
          useradd -m builder

      - uses: actions/checkout@v4

      - name: Build package as non-root user
        run: |
          chown -R builder:builder .
          su builder -c makepkg

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: archpkg
          path: notees-gtk-*.pkg.tar.zst

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-dist, archpkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
